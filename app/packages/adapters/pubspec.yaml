name: adapters
description: Umsetzungen der Ports von core für Android (Flutter).
publish_to: none
version: 0.0.1
resolution: workspace

environment:
  sdk: ^3.13.5
  flutter: 3.47.7

dependencies:
  flutter:
    sdk: flutter
  core:
    path: ../core
  drift: 2.35.3
  sqlite3: 3.8.0
  flutter_secure_storage: 11.2.0
  universal_ble: 3.2.0
  cryptography: 2.9.0
  # WP13 / ADR-0009: Karte nur im Kartenadapter (lib/src/map), exakt gepinnt (R008 Hinweis 8).
  flutter_map: 8.3.2
  flutter_map_vector_tiles: 2.11.0
  latlong2: 0.10.1
  http: 1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.4.0
