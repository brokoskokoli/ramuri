name: release
# Tag vX.Y.Z oder vX.Y.Z-rcN: volles Gate, signierter Build, GitHub-Release als ENTWURF (nie veröffentlicht, kein upload-artifact).
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'brokoskokoli/ramuri'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag prüfen
        run: |
          set -eu
          tool/build_signed.sh --print-version "$TAG"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD refs/remotes/origin/main || { echo "FEHLER: $TAG liegt nicht in main"; exit 1; }
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Flutter einrichten
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: app/pubspec.yaml
          cache: true
      - name: Gate
        run: sh tool/gate.sh
      - name: Signierter Build
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: tool/build_signed.sh "$TAG"
      - name: Entwurf anlegen oder aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version=${TAG#v}
          flags=
          case "$TAG" in *-rc*) flags=--prerelease ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            [ "$(gh release view "$TAG" --json isDraft -q .isDraft)" = true ] \
              || { echo "FEHLER: Release $TAG ist schon veröffentlicht; die Pipeline ändert sie nicht"; exit 1; }
            # shellcheck disable=SC2086
            gh release edit "$TAG" --title "ramuri $version" --draft $flags
          else
            # shellcheck disable=SC2086
            gh release create "$TAG" --draft --verify-tag --title "ramuri $version" --generate-notes $flags
          fi
          gh release upload "$TAG" "dist/ramuri-$version.apk" "dist/ramuri-$version.aab" dist/SHA256SUMS.txt --clobber
