name: gate
on:
  push:
    branches: [main, 'wp/**', 'issue-**']
  pull_request:
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/wp/') || startsWith(github.ref, 'refs/heads/issue-') }}
permissions:
  contents: read
jobs:
  gate:
    # Eigene Zweige issue-* und wp/* bekommen das Gate schon über push (gleicher Stand); der zweite Lauf zu
    # pull_request wird übersprungen. PRs aus Forks und von anderen Zweigen (z. B. Dependabot) starten kein
    # Gate über push und laufen hier weiter.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      !(startsWith(github.head_ref, 'issue-') || startsWith(github.head_ref, 'wp/'))
    runs-on: ubuntu-latest
    # Gemessen an 75 grünen Läufen dieses Jobs (bis 2026-11-19): 17,4 bis 28,4 min samt Einrichtung, Median
    # 23,8 min, längster 1706 s (davon tool/gate.sh 1656 s). Das alte Limit von 30 min ließ nur 1,6 min Luft;
    # unter paralleler Last brach der Release-APK-Schritt ohne Fehler ab. 45 min wie e2e.yml: 16,6 min Abstand.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
          # Gradle-Abhängigkeiten und Plugins zwischenspeichern (Schlüssel aus den Gradle-Dateien), damit nicht
          # jeder Job sie neu lädt. Caches eines Zweigs sind für main nicht lesbar; nightly/release ohne Cache.
          cache: gradle
          cache-dependency-path: |
            app/android/**/*.gradle.kts
            app/android/gradle.properties
            app/android/gradle/wrapper/gradle-wrapper.properties
      - name: Flutter einrichten
        if: hashFiles('app/pubspec.yaml') != ''
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: app/pubspec.yaml
          cache: true
      # NDK vor dem ersten Gradle-Build fest installieren (Version aus der Flutter-Version, bis zu zwei
      # Wiederholungen); sonst lädt Gradle es im Build nach, und ein beschädigter Download bricht ab.
      - name: Android-NDK installieren
        if: hashFiles('app/pubspec.yaml') != ''
        run: bash tool/ci_ndk.sh
      # Die Build-Hooks von sqlite3 laden SQLite3MultipleCiphers zur Bauzeit (ADR-0003). Ihr gemeinsames
      # Ausgabeverzeichnis wird zwischengespeichert; der Hook prüft vorhandene Dateien weiter per SHA-256
      # und lädt nur bei Abweichung neu.
      - name: sqlite3mc-Cache laden
        if: hashFiles('app/pubspec.yaml') != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/.dart_tool/hooks_runner/shared/sqlite3
          key: sqlite3mc-gate-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: sqlite3mc-gate-${{ hashFiles('app/pubspec.lock') }}-
      - name: sqlite3mc vor dem Build
        if: hashFiles('app/pubspec.yaml') != ''
        run: find app/.dart_tool/hooks_runner/shared/sqlite3 -type f -printf '%TY-%Tm-%Td %TT %s %P\n' 2>/dev/null || echo "kein sqlite3mc im Cache"
      - run: sh tool/gate.sh
      # Gespeichert wird nur ein neuer Inhalt (Schlüssel mit Hash der Dateien); unverändert = Treffer, kein Upload.
      - name: sqlite3mc nach dem Build
        if: always() && hashFiles('app/.dart_tool/hooks_runner/shared/sqlite3/**') != ''
        run: find app/.dart_tool/hooks_runner/shared/sqlite3 -type f -printf '%TY-%Tm-%Td %TT %s %P\n'
      - name: sqlite3mc-Cache speichern
        if: always() && hashFiles('app/.dart_tool/hooks_runner/shared/sqlite3/**') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/.dart_tool/hooks_runner/shared/sqlite3
          key: sqlite3mc-gate-${{ hashFiles('app/pubspec.lock') }}-${{ hashFiles('app/.dart_tool/hooks_runner/shared/sqlite3/**') }}
