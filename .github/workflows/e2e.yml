name: e2e
on:
  push:
    branches: [main, 'wp/**', 'issue-**']
permissions:
  contents: read
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/wp/') || startsWith(github.ref, 'refs/heads/issue-') }}
jobs:
  e2e:
    name: e2e api ${{ matrix.api }} ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      E2E_SHARD: ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        api: [31, 36]
        # Zwei Shards je API, damit kein Job allein alles traegt: die Last der E2E-Tests verteilt sich auf
        # zwei Jobs je API. Welche Stufen zu welchem Shard gehoeren, steht nur in tool/ci_e2e.sh
        # (shard_sammlung, shard_stufen); hier nicht wiederholen. "stufen" darf mit der Echtzeit-Stufe ca.
        # 16 min dauern (Entscheidung Supervisor); Grenze ist das Job-Limit von 45 min.
        shard: [sammlung, stufen]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
          # Gradle-Abhängigkeiten und Plugins zwischenspeichern (Schlüssel aus den Gradle-Dateien), damit nicht
          # jeder Job sie neu lädt. Caches eines Zweigs sind für main nicht lesbar; nightly/release ohne Cache.
          cache: gradle
          cache-dependency-path: |
            app/android/**/*.gradle.kts
            app/android/gradle.properties
            app/android/gradle/wrapper/gradle-wrapper.properties
      - name: Flutter einrichten
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: app/pubspec.yaml
          cache: true
      - name: KVM aktivieren
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Abhängigkeiten
        run: cd app && flutter pub get
      # NDK vor dem ersten Gradle-Build fest installieren (Version aus der Flutter-Version, bis zu zwei
      # Wiederholungen); sonst lädt Gradle es im Build nach, und ein beschädigter Download bricht ab.
      - name: Android-NDK installieren
        run: bash tool/ci_ndk.sh
      # Die Build-Hooks von sqlite3 laden SQLite3MultipleCiphers zur Bauzeit (ADR-0003). Ihr gemeinsames
      # Ausgabeverzeichnis wird zwischengespeichert; der Hook prüft vorhandene Dateien weiter per SHA-256
      # und lädt nur bei Abweichung neu.
      - name: sqlite3mc-Cache laden
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/.dart_tool/hooks_runner/shared/sqlite3
          key: sqlite3mc-e2e-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: sqlite3mc-e2e-${{ hashFiles('app/pubspec.lock') }}-
      - name: sqlite3mc vor dem Build
        run: find app/.dart_tool/hooks_runner/shared/sqlite3 -type f -printf '%TY-%Tm-%Td %TT %s %P\n' 2>/dev/null || echo "kein sqlite3mc im Cache"
      - name: AVD-Cache
        id: avd-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api }}-x86_64-pixel6-v1
      # Festes Geraeteprofil pixel_6 (1080x2400): Der Standard des Runners ist ein
      # winziger Bildschirm (320x640), auf dem Tests wegen abgeschnittener
      # Bedienelemente scheitern, die auf einem echten Geraet sichtbar sind.
      - name: AVD und Snapshot erzeugen (nur bei Cache-Miss)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          profile: pixel_6
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Snapshot erzeugt"
      # Der Test-Sensor (main_debug.dart) braucht keine Hardware; die
      # Integrationstests starten die App selbst (kein TEST_SENSOR_RR nötig).
      # E2E_SHOTS=1: Bildschirmfotos hell und dunkel bei jeder SHOT-Marke nach e2e-out/shots/ (tool/ci_e2e.sh).
      - name: E2E-Tests
        env:
          E2E_SHOTS: '1'
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          profile: pixel_6
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: sh tool/ci_e2e.sh e2e-out
      # Gespeichert wird nur ein neuer Inhalt (Schlüssel mit Hash der Dateien); unverändert = Treffer, kein Upload.
      - name: sqlite3mc nach dem Build
        if: always() && hashFiles('app/.dart_tool/hooks_runner/shared/sqlite3/**') != ''
        run: find app/.dart_tool/hooks_runner/shared/sqlite3 -type f -printf '%TY-%Tm-%Td %TT %s %P\n'
      - name: sqlite3mc-Cache speichern
        if: always() && hashFiles('app/.dart_tool/hooks_runner/shared/sqlite3/**') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/.dart_tool/hooks_runner/shared/sqlite3
          key: sqlite3mc-e2e-${{ hashFiles('app/pubspec.lock') }}-${{ hashFiles('app/.dart_tool/hooks_runner/shared/sqlite3/**') }}
      # Nur bei Rot. Hochgeladen wird ausschließlich, was tool/ci_e2e.sh erzeugt:
      # Logcat gefiltert auf Flutter-Tag und Abstürze (kein Systemlog), ein
      # Bildschirmfoto und Fehlerzeilen. Die Tests nutzen nur synthetische Daten;
      # der Filter verhindert zusätzlich, dass Fremd- oder Gerätedaten
      # mitwandern (SEC-0001..0010: keine Gesundheitswerte in Artefakten/Logs).
      # Die Fotos der SHOT-Marken (e2e-out/shots/) liegen nur im Artefakt "-fotos" unten.
      - name: Artefakte bei Rot
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-api${{ matrix.api }}-${{ matrix.shard }}-fehler
          path: |
            e2e-out/
            !e2e-out/shots/
          retention-days: 7
          if-no-files-found: ignore
      # Bei jedem Lauf, auch bei Grün: nur die Bildschirmfotos hell und dunkel der SHOT-Marken
      # (e2e-out/shots/<stufe>-<name>.png). Sie zeigen ausschließlich synthetische Daten der Tests,
      # keine Gesundheits- oder Gerätedaten echter Personen (SEC-0001 bis SEC-0010); Aufbewahrung 7 Tage.
      - name: Bildschirmfotos
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-api${{ matrix.api }}-${{ matrix.shard }}-fotos
          path: e2e-out/shots/
          retention-days: 7
          if-no-files-found: ignore
