<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Messung</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Sora:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.text}}; font-family: Manrope, sans-serif; padding: 28px 20px 24px; display: flex; flex-direction: column; gap: 20px">
  <header style="display: flex; align-items: center; gap: 8px">
    <h1 style="margin: 0; flex: 1; font-family: Sora, sans-serif; letter-spacing: -0.03em; font-size: 22px; font-weight: 700">Messung</h1>
    <span style="font-size: 13px; font-weight: 700; color: {{t.muted}}">Schritt 2 von 2</span>
  </header>

  <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 24px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
      <span style="font-family: Sora, sans-serif; font-variant-numeric: tabular-nums; font-size: 64px; font-weight: 700; letter-spacing: -0.03em">{{goodTime}}</span>
      <span style="font-size: 14px; font-weight: 700; color: {{t.muted}}">gutes Signal {{goodTime}} von 1:00</span>
    </div>
    <div role="progressbar" aria-label="Gutes Signal am Stück" aria-valuemin="0" aria-valuemax="60" aria-valuenow="{{goodSec}}" style="height: 8px; border-radius: 4px; background: {{t.chip}}; overflow: hidden"><div style="width: {{goodPct}}; height: 100%; background: {{t.mint}}"></div></div>
    <span style="margin-top: -12px; text-align: center; font-size: 13px; font-weight: 700; color: {{t.muted}}">Gesamtzeit {{totalTime}}, höchstens 2:00</span>

    <section aria-label="Signal" style="background: {{t.card}}; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <svg viewBox="0 0 318 70" width="100%" height="70" role="img" aria-label="Pulskurve aus der Kamera">
        <polyline points="0,40 18,40 26,18 34,58 42,40 70,40 78,16 86,60 94,40 122,40 130,18 138,58 146,40 174,40 182,17 190,59 198,40 226,40 234,18 242,58 250,40 278,40 286,16 294,60 302,40 318,40" fill="none" stroke="{{t.glut}}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></polyline>
      </svg>
      <div style="display: flex; align-items: center; gap: 8px">
        <span style="width: 10px; height: 10px; border-radius: 5px; background: {{sigDot}}"></span>
        <span style="font-size: 14px; font-weight: 800">{{sigText}}</span>
      </div>
      <span style="font-size: 13px; line-height: 1.45; color: {{t.muted}}">{{sigHint}}</span>
    </section>
    <span style="text-align: center; font-size: 15px; line-height: 1.5; color: {{t.muted}}">Hand ruhig als Kuppel halten, ganz normal atmen.</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <a href="{{nextHref}}" style="height: 52px; border-radius: 26px; border: 1px solid {{t.border}}; background: {{t.card}}; color: {{t.text}}; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800; text-decoration: none">Weiter (Vorschau)</a>
    <a href="{{backHref}}" style="height: 48px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800; color: {{t.link}}; text-decoration: none">Abbrechen</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"signal":{"editor":"enum","options":["gut","schwach"],"default":"gut"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  theme(dark) {
    return dark
      ? { bg: '#0E1A1A', card: '#172828', text: '#EAF2F0', muted: '#A3B8B4', border: '#2A4140', link: '#7FD6C6', mint: '#7FD6C6', chip: '#1F3333', glut: '#FF7A45' }
      : { bg: '#F3F6F5', card: '#FFFFFF', text: '#0E1A1A', muted: '#4F6361', border: '#DAE4E1', link: '#0F5E5A', mint: '#7FD6C6', chip: '#E2EAE8', glut: '#E0561F' };
  }
  renderVals() {
    const dark = this.props.dark ?? false;
    const t = this.theme(dark);
    const sfx = dark ? '-dunkel' : '';
    const good = (this.props.signal ?? 'gut') === 'gut';
    return {
      t,
      goodSec: good ? 42 : 18, goodPct: good ? '70%' : '30%', goodTime: good ? '0:42' : '0:18', totalTime: good ? '0:58' : '1:12',
      sigDot: good ? t.mint : t.glut,
      sigText: good ? 'Signal gut' : 'Signal schwach',
      sigHint: good ? 'Sobald 60 s gutes Signal beisammen sind, endet die Messung von selbst.' : 'Mittelfinger etwas lockerer auflegen, die übrigen Finger als Kuppel daneben, Hand abstützen. Die Messung läuft bis zu 2 min weiter; reicht die Qualität am Ende nicht, misst du noch einmal.',
      nextHref: 'Ergebnis' + sfx + '.dc.html',
      backHref: 'Main' + sfx + '.dc.html'
    };
  }
}
</script>
</body>
</html>
