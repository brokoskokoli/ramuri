<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Live Intervalltraining</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Sora:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#7FD6C6;text-decoration:none}a:hover{color:#A9E3D8}
button{font-family:inherit;cursor:pointer}
.num{font-family:Sora,sans-serif;font-variant-numeric:tabular-nums}
h1{font-family:Sora,sans-serif;letter-spacing:-0.03em}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E1A1A; color: #FFFFFF; font-family: Manrope, sans-serif; padding: 20px 20px 32px; display: flex; flex-direction: column; gap: 16px">
  <header style="display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="font-size: 14px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; color: #7FD6C6">Intervalle 6 × 400 m</span>
      <span class="num" style="font-size: 15px; font-weight: 600; color: #CDDEDB">31:02</span>
    </div>
    <div role="img" aria-label="Fortschritt: Intervall 3 von 6" style="display: flex; gap: 3px; height: 8px">
      <div style="flex: 6; background: #7FD6C6; border-radius: 4px"></div>
      <div style="flex: 2; background: #7FD6C6; border-radius: 4px"></div><div style="flex: 2; background: #7FD6C6; border-radius: 4px"></div>
      <div style="flex: 2; background: #7FD6C6; border-radius: 4px"></div><div style="flex: 2; background: #7FD6C6; border-radius: 4px"></div>
      <div style="flex: 2; background: #7FD6C6; border-radius: 4px; opacity: 0.55"></div><div style="flex: 2; background: #284040; border-radius: 4px"></div>
      <div style="flex: 2; background: #284040; border-radius: 4px"></div><div style="flex: 2; background: #284040; border-radius: 4px"></div>
      <div style="flex: 2; background: #284040; border-radius: 4px"></div><div style="flex: 2; background: #284040; border-radius: 4px"></div>
      <div style="flex: 2; background: #284040; border-radius: 4px"></div><div style="flex: 2; background: #284040; border-radius: 4px"></div>
      <div style="flex: 5; background: #284040; border-radius: 4px"></div>
    </div>
  </header>

  <section style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 20px">
    <span style="font-size: 16px; font-weight: 800; color: #7FD6C6">Intervall 3 von 6 · Schnell</span>
    <span class="num" style="font-size: 104px; font-weight: 700; letter-spacing: -0.04em; line-height: 1">220</span>
    <span style="font-size: 18px; font-weight: 600; color: #CDDEDB">Meter noch</span>
  </section>

  <section aria-label="Soll-Ist-Pace" style="background: #172828; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-size: 13px; font-weight: 700; color: #B5C9C6">Pace jetzt</span>
      <span style="font-size: 13px; font-weight: 700; color: #B5C9C6">Ziel 4:30–4:45 /km</span>
    </div>
    <span class="num" style="font-size: 40px; font-weight: 700">4:38 <span style="font-size: 16px; color: #B5C9C6">/km</span></span>
    <div role="img" aria-label="Pace liegt im Zielbereich" style="position: relative; height: 14px; border-radius: 7px; background: #284040">
      <div style="position: absolute; left: 30%; width: 40%; top: 0; bottom: 0; border-radius: 7px; background: #0F5E5A"></div>
      <div style="position: absolute; left: 51%; top: -5px; width: 6px; height: 24px; border-radius: 3px; background: #7FD6C6"></div>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: #B5C9C6"><span>langsamer</span><span style="color: #7FD6C6">genau richtig</span><span>schneller</span></div>
  </section>

  <section role="status" style="background: #FF7A45; color: #0E1A1A; border-radius: 22px; padding: 14px 16px; display: flex; gap: 12px; align-items: center">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="#0E1A1A" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>
    <div style="display: flex; flex-direction: column; flex: 1">
      <span style="font-size: 15px; font-weight: 800"><span class="num">178</span> bpm · über Zone 4</span>
      <span style="font-size: 13px; font-weight: 600">Ganz ruhig: Tempo halten, nicht steigern.</span>
    </div>
  </section>

  <div style="background: #172828; border-radius: 18px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; font-size: 14px">
    <span style="color: #B5C9C6; font-weight: 600">Danach</span>
    <span style="font-weight: 800">2:00 Trabpause</span>
  </div>

  <div style="flex-grow: 1"></div>

  <div style="display: flex; justify-content: center; align-items: center; gap: 28px">
    <button aria-label="Intervall überspringen" style="width: 68px; height: 68px; border-radius: 34px; border: 0; background: #172828; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5l9 7-9 7zM19 5v14"></path></svg>
    </button>
    <button aria-label="Pausieren" style="width: 104px; height: 104px; border-radius: 52px; border: 0; background: #7FD6C6; color: #0E1A1A; display: flex; align-items: center; justify-content: center">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1.5"></rect><rect x="14" y="4" width="4" height="16" rx="1.5"></rect></svg>
    </button>
    <div style="width: 68px"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
