<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Heute mit Erholung, dunkel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Sora:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #0E1A1A">
  <dc-import name="Heute" dark="{{dark}}" fall="{{fall}}" warnsignal="{{warnsignal}}" dev="{{dev}}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"fall":{"editor":"enum","options":["Zahl","Eingeschränkt","Unzureichend","Basis"],"default":"Zahl"},"warnsignal":{"editor":"boolean","default":false},"dev":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { dark: true, fall: this.props.fall ?? "Zahl", warnsignal: this.props.warnsignal ?? false, dev: this.props.dev ?? false }; }
}
</script>
</body>
</html>
