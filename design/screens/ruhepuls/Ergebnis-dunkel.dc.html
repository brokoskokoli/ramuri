<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Ruhepuls, Ergebnis, dunkel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Sora:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 900px; background: #0E1A1A">
  <dc-import name="Ergebnis" dark="{{dark}}" qualitaet="{{qualitaet}}" hint-size="390px,900px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"qualitaet":{"editor":"enum","options":["gut","eingeschränkt"],"default":"eingeschränkt"},"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return { dark: true, qualitaet: this.props.qualitaet ?? 'eingeschränkt' }; }
}
</script>
</body>
</html>
