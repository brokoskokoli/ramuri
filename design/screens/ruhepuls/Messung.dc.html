<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Messung läuft</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Sora:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.text}}; font-family: Manrope, sans-serif; padding: 28px 20px 28px; display: flex; flex-direction: column; gap: 16px">
  <header style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
    <a href="{{cancelHref}}" style="min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid {{t.border}}; background: {{t.card}}; color: {{t.text}}; display: flex; align-items: center; font-size: 15px; font-weight: 800; text-decoration: none; box-sizing: border-box">Abbrechen</a>
    <span style="font-size: 13px; font-weight: 700; color: {{t.muted}}">Messung · Sitzend</span>
  </header>

  <section aria-label="Laufender Puls" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding-top: 8px">
    <span style="font-size: 14px; font-weight: 700; color: {{t.muted}}">Puls (bpm), laufend</span>
    <span style="font-family: Sora, sans-serif; font-variant-numeric: tabular-nums; font-size: 88px; font-weight: 700; letter-spacing: -0.04em; line-height: 1; color: {{pulseColor}}">{{pulse}}</span>
    <span style="font-size: 13px; font-weight: 600; color: {{t.muted}}">{{pulseNote}}</span>
  </section>

  <section aria-label="Pulskurve" style="background: {{t.card}}; border-radius: 24px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="font-size: 13px; font-weight: 700; color: {{t.muted}}">Pulskurve, letzte 5 s</span>
      <span style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 800">
        <span aria-hidden="true" style="display: flex; align-items: flex-end; gap: 3px; height: 16px">
          <span style="width: 5px; height: 6px; border-radius: 2px; background: {{bar1}}"></span>
          <span style="width: 5px; height: 11px; border-radius: 2px; background: {{bar2}}"></span>
          <span style="width: 5px; height: 16px; border-radius: 2px; background: {{bar3}}"></span>
        </span>
        Signal {{qualityWord}}
      </span>
    </div>
    <sc-if value="{{isGood}}" hint-placeholder-val="{{ false }}">
      <svg viewBox="0 0 350 140" width="100%" height="140" role="img" aria-label="Gleichmäßige Pulskurve mit deutlichen Schlägen">
        <line x1="0" y1="110" x2="350" y2="110" stroke="{{t.div}}" stroke-width="1"></line>
        <path d="M0 104 c6 0 10 -66 16 -66 c6 0 8 34 14 36 c4 2 6 -6 10 -6 c8 0 14 30 28 36 c6 0 10 -66 16 -66 c6 0 8 34 14 36 c4 2 6 -6 10 -6 c8 0 14 30 28 36 c6 0 10 -66 16 -66 c6 0 8 34 14 36 c4 2 6 -6 10 -6 c8 0 14 30 28 36 c6 0 10 -66 16 -66 c6 0 8 34 14 36 c4 2 6 -6 10 -6 c8 0 14 30 28 36 c6 0 10 -66 16 -66 c6 0 8 34 14 36 c4 2 6 -6 10 -6 c8 0 14 30 28 36" fill="none" stroke="{{t.curve}}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
        <circle cx="340" cy="104" r="6" fill="{{t.glut}}"></circle>
      </svg>
    </sc-if>
    <sc-if value="{{isWeak}}" hint-placeholder-val="{{ true }}">
      <svg viewBox="0 0 350 140" width="100%" height="140" role="img" aria-label="Flache, unruhige Pulskurve ohne deutliche Schläge">
        <line x1="0" y1="110" x2="350" y2="110" stroke="{{t.div}}" stroke-width="1"></line>
        <path d="M0 80 l14 -6 l12 9 l16 -4 l10 -12 l14 10 l12 3 l18 -9 l12 6 l16 -2 l10 8 l14 -14 l12 4 l16 7 l12 -5 l18 -3 l10 10 l14 -8 l12 2 l16 6 l12 -9 l14 5 l12 1 l18 -6 l10 4 l16 1" fill="none" stroke="{{t.curveWeak}}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
        <circle cx="340" cy="78" r="6" fill="{{t.glut}}"></circle>
      </svg>
    </sc-if>
  </section>

  <section role="status" style="background: {{hintBg}}; color: {{hintText}}; border-radius: 20px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="{{hintIcon}}"></path></svg>
    <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 800">{{hintTitle}}</span><span style="font-size: 14px; line-height: 1.45">{{hintBody}}</span></span>
  </section>

  <div style="flex-grow: 1"></div>

  <section aria-label="Fortschritt" style="display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-size: 14px; font-weight: 700">{{progressLabel}}</span>
      <span style="font-family: Sora, sans-serif; font-variant-numeric: tabular-nums; font-size: 16px; font-weight: 700">38 von 60 s</span>
    </div>
    <div role="progressbar" aria-label="Messfortschritt" aria-valuemin="0" aria-valuemax="60" aria-valuenow="38" style="height: 10px; border-radius: 5px; background: {{t.track}}; overflow: hidden">
      <div style="width: 63%; height: 10px; border-radius: 5px; background: {{t.fill}}"></div>
    </div>
    <span style="font-size: 13px; color: {{t.muted}}">Atme einfach weiter, wie es von selbst kommt.</span>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"signal":{"editor":"enum","options":["gut","zu fest","verrutscht","zu dunkel"],"default":"zu fest"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  theme(dark) {
    return dark
      ? { bg: '#0E1A1A', card: '#172828', text: '#EAF2F0', muted: '#A3B8B4', border: '#2A4140', div: '#223636', soft: '#1C3836', link: '#7FD6C6', track: '#223636', fill: '#7FD6C6', curve: '#FF7A45', curveWeak: '#6E8784', glut: '#FF7A45', barOn: '#7FD6C6', barOff: '#2A4140', warnBg: '#3A221A', warnText: '#FFB89A', okBg: '#1C3836', okText: '#EAF2F0' }
      : { bg: '#F3F6F5', card: '#FFFFFF', text: '#0E1A1A', muted: '#4F6361', border: '#DAE4E1', div: '#EBF1EF', soft: '#DDF2EE', link: '#0F5E5A', track: '#DAE4E1', fill: '#0F5E5A', curve: '#E0561F', curveWeak: '#9AABA8', glut: '#E0561F', barOn: '#0F5E5A', barOff: '#C9D6D3', warnBg: '#FCE6DB', warnText: '#7A2A0C', okBg: '#DDF2EE', okText: '#0E1A1A' };
  }
  renderVals() {
    const dark = this.props.dark ?? false;
    const t = this.theme(dark);
    const sfx = dark ? '-dunkel' : '';
    const sig = this.props.signal ?? 'zu fest';
    const good = sig === 'gut';
    const hints = {
      'gut': ['Signal gut', 'Finger so lassen und ruhig halten.'],
      'zu fest': ['Zu fest gedrückt', 'Finger etwas lockern. Kamera und Blitz bleiben bedeckt.'],
      'verrutscht': ['Finger verrutscht', 'Kamera und Blitz wieder ganz mit der Fingerkuppe abdecken.'],
      'zu dunkel': ['Zu dunkel', 'Der Blitz scheint nicht durch den Finger. Leg ihn mit auf den Blitz.']
    };
    const h = hints[sig] || hints['zu fest'];
    return {
      t,
      cancelHref: 'Main' + sfx + '.dc.html',
      isGood: good, isWeak: !good,
      pulse: good ? '62' : '–',
      pulseColor: good ? t.text : t.muted,
      pulseNote: good ? 'stabil seit 12 s' : 'wird gesucht',
      qualityWord: good ? 'gut' : 'schwach',
      bar1: t.barOn, bar2: good ? t.barOn : t.barOff, bar3: good ? t.barOn : t.barOff,
      hintBg: good ? t.okBg : t.warnBg,
      hintText: good ? t.okText : t.warnText,
      hintIcon: good ? 'M8 12.5l2.5 2.5L16 9.5' : 'M12 7.5v5M12 16v.5',
      hintTitle: h[0], hintBody: h[1],
      progressLabel: good ? 'Ruhig halten' : 'Finger justieren, die Zeit läuft weiter'
    };
  }
}
</script>
</body>
</html>
