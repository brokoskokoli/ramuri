<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Ruhephase</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Sora:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.text}}; font-family: Manrope, sans-serif; padding: 28px 20px 28px; display: flex; flex-direction: column; gap: 16px">
  <header style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
    <a href="{{cancelHref}}" style="min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid {{t.border}}; background: {{t.card}}; color: {{t.text}}; display: flex; align-items: center; font-size: 15px; font-weight: 800; text-decoration: none; box-sizing: border-box">Abbrechen</a>
    <span style="font-size: 13px; font-weight: 700; color: {{t.muted}}">Ruhephase · Sitzend</span>
    <button aria-label="{{soundLabel}}" aria-pressed="{{soundPressed}}" onClick="{{toggleSound}}" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid {{t.border}}; background: {{t.card}}; color: {{t.text}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <sc-if value="{{soundOn}}" hint-placeholder-val="{{ true }}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7"></path><path d="M19 6a8.5 8.5 0 0 1 0 12"></path></svg>
      </sc-if>
      <sc-if value="{{soundOff}}" hint-placeholder-val="{{ false }}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"></path><path d="M17 9l5 6M22 9l-5 6"></path></svg>
      </sc-if>
    </button>
  </header>

  <div style="flex-grow: 1"></div>

  <div style="display: flex; justify-content: center">
    <div style="position: relative; width: 264px; height: 264px">
      <svg viewBox="0 0 264 264" width="264" height="264" role="img" aria-label="Noch 3 Minuten 12 Sekunden Ruhephase">
        <circle cx="132" cy="132" r="120" fill="none" stroke="{{t.track}}" stroke-width="10"></circle>
        <circle cx="132" cy="132" r="120" fill="none" stroke="{{t.ring}}" stroke-width="10" stroke-linecap="round" stroke-dasharray="482.5 754" transform="rotate(-90 132 132)"></circle>
      </svg>
      <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
        <span style="font-family: Sora, sans-serif; font-variant-numeric: tabular-nums; font-size: 56px; font-weight: 600; letter-spacing: -0.03em; line-height: 1">3:12</span>
        <span style="font-size: 14px; font-weight: 700; color: {{t.muted}}">noch von 5:00 min</span>
      </div>
    </div>
  </div>

  <section aria-live="polite" style="display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; padding: 8px 12px 0">
    <p style="margin: 0; font-family: Sora, sans-serif; font-size: 24px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.3">Lass die Schultern sinken.</p>
    <p style="margin: 0; font-size: 16px; line-height: 1.5; color: {{t.muted}}">Du musst nichts tun. Dein Atem darf so kommen und gehen, wie er gerade ist.</p>
  </section>

  <div style="flex-grow: 1"></div>

  <section style="background: {{t.card}}; border-radius: 20px; padding: 14px 16px; display: flex; gap: 12px; align-items: center">
    <span style="width: 36px; height: 36px; flex: none; border-radius: 12px; background: {{t.soft}}; color: {{t.link}}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></span>
    <span style="font-size: 14px; line-height: 1.45; color: {{t.muted}}">Danach legst du den Finger auf, und die App misst 60 s. {{soundHint}}</span>
  </section>

  <a href="{{skipHref}}" style="min-height: 48px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800; color: {{t.link}}; text-decoration: none">Ich bin schon entspannt, jetzt messen</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sound: true }; }
  theme(dark) {
    return dark
      ? { bg: '#0E1A1A', card: '#172828', text: '#EAF2F0', muted: '#A3B8B4', border: '#2A4140', link: '#7FD6C6', soft: '#1C3836', track: '#223636', ring: '#7FD6C6' }
      : { bg: '#F3F6F5', card: '#FFFFFF', text: '#0E1A1A', muted: '#4F6361', border: '#DAE4E1', link: '#0F5E5A', soft: '#DDF2EE', track: '#DDF2EE', ring: '#0F5E5A' };
  }
  renderVals() {
    const dark = this.props.dark ?? false;
    const sfx = dark ? '-dunkel' : '';
    const on = this.state.sound;
    return {
      t: this.theme(dark),
      cancelHref: 'Main' + sfx + '.dc.html',
      skipHref: 'Messung' + sfx + '.dc.html',
      soundOn: on, soundOff: !on,
      soundPressed: on ? 'true' : 'false',
      soundLabel: on ? 'Ton an, ausschalten' : 'Ton aus, einschalten',
      soundHint: on ? 'Ein leiser Ton sagt dir, wann es losgeht.' : 'Das Handy vibriert, wenn es losgeht.',
      toggleSound: () => this.setState({ sound: !on })
    };
  }
}
</script>
</body>
</html>
