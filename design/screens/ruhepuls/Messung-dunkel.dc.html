<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Messung läuft, dunkel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Sora:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #0E1A1A">
  <dc-import name="Messung" dark="{{dark}}" signal="{{signal}}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"signal":{"editor":"enum","options":["gut","zu fest","verrutscht","zu dunkel"],"default":"gut"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { dark: true, signal: this.props.signal ?? 'gut' }; }
}
</script>
</body>
</html>
