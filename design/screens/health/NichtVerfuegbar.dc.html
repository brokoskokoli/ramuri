<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Health Connect nicht verfügbar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Sora:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.text}}; font-family: Manrope, sans-serif; padding: 28px 20px 24px; display: flex; flex-direction: column; gap: 16px">
  <header style="display: flex; align-items: center; gap: 8px">
    <a href="{{backHref}}" aria-label="Zurück zum Profil" style="flex: none; width: 44px; height: 44px; border-radius: 22px; background: {{t.card}}; border: 1px solid {{t.border}}; display: flex; align-items: center; justify-content: center; color: {{t.text}}; box-sizing: border-box">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: Sora, sans-serif; letter-spacing: -0.03em; font-size: 21px; line-height: 1.2; font-weight: 700">Gesundheitsdaten aus Health Connect</h1>
  </header>

  <section aria-label="Status" style="background: {{t.card}}; border-radius: 24px; padding: 22px 18px; display: flex; flex-direction: column; gap: 12px">
    <span style="width: 52px; height: 52px; border-radius: 16px; background: {{t.chip}}; color: {{t.muted}}; display: flex; align-items: center; justify-content: center">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 1.6-.6 3-1.5 4.3"></path><path d="M3 3l18 18"></path></svg>
    </span>
    <h2 style="margin: 0; font-family: Sora, sans-serif; letter-spacing: -0.02em; font-size: 20px; line-height: 1.25; font-weight: 700">{{title}}</h2>
    <p style="margin: 0; font-size: 15px; line-height: 1.5; color: {{t.muted}}">{{body}}</p>
  </section>

  <section aria-label="Was trotzdem geht" style="background: {{t.card}}; border-radius: 24px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 15px; font-weight: 800">ramuri läuft ohne Health Connect ganz normal</span>
    <sc-for list="{{works}}" as="w" hint-placeholder-count="4">
      <div style="display: flex; gap: 10px; align-items: center; font-size: 14px; line-height: 1.4">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.link}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M5 12l5 5 9-10"></path></svg>
        <span>{{w}}</span>
      </div>
    </sc-for>
  </section>

  <div style="flex-grow: 1"></div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <sc-if value="{{canInstall}}" hint-placeholder-val="{{ true }}">
      <a href="{{selfHref}}" style="height: 56px; border-radius: 28px; background: {{t.mint}}; color: {{t.onMint}}; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 17px; font-weight: 800; text-decoration: none">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg>Health Connect installieren</a>
      <span style="font-size: 13px; line-height: 1.45; color: {{t.muted}}; text-align: center">Öffnet den Play Store. Danach hierher zurückkommen.</span>
    </sc-if>
    <a href="{{backHref}}" style="height: 48px; border-radius: 24px; border: 1.5px solid {{t.border}}; box-sizing: border-box; color: {{t.text}}; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800; text-decoration: none">Ohne Health Connect weiter</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"grund":{"editor":"enum","options":["installieren","nichtUnterstuetzt"],"default":"installieren"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  theme(dark) {
    return dark
      ? { bg: '#0E1A1A', card: '#172828', text: '#EAF2F0', muted: '#A3B8B4', border: '#2A4140', link: '#7FD6C6', mint: '#7FD6C6', onMint: '#0E1A1A', chip: '#1F3333' }
      : { bg: '#F3F6F5', card: '#FFFFFF', text: '#0E1A1A', muted: '#4F6361', border: '#DAE4E1', link: '#0F5E5A', mint: '#7FD6C6', onMint: '#0E1A1A', chip: '#E2EAE8' };
  }
  renderVals() {
    const dark = this.props.dark ?? false;
    const t = this.theme(dark);
    const sfx = dark ? '-dunkel' : '';
    const install = (this.props.grund ?? 'installieren') === 'installieren';
    return {
      t,
      canInstall: install,
      title: install ? 'Health Connect ist noch nicht installiert' : 'Health Connect gibt es für dieses Handy nicht',
      body: install
        ? 'Auf Android 13 und älter ist Health Connect eine eigene App aus dem Play Store. Ab Android 14 ist es schon eingebaut.'
        : 'Die Android-Version dieses Handys wird von Health Connect nicht unterstützt. Gesundheitsdaten anderer Apps lassen sich hier darum nicht abrufen.',
      works: ['Läufe aufzeichnen, mit und ohne Pulsgurt', 'Verlauf, Fortschritt und Plan', 'Ruhepuls mit der Handykamera messen', 'Trainings von Hand nachtragen'],
      backHref: 'Main' + sfx + '.dc.html',
      selfHref: 'NichtVerfuegbar' + sfx + '.dc.html'
    };
  }
}
</script>
</body>
</html>
